worker_processes 1;
pid /tmp/nginx.pid;
# No request URIs, OAuth codes, cookies, credentials or event bodies in logs.
# Even critical upstream-connect errors append the full request URI in Nginx.
# Disable request-bearing error output as well as access logs: callbacks carry
# one-use OAuth credentials. Configuration validation still reports to its CLI.
error_log /dev/null crit;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_header_timeout 5s;
    client_body_timeout 15s;
    send_timeout 35s;
    keepalive_timeout 60s;
    large_client_header_buffers 4 4k;
    client_max_body_size 64k;
    upstream cosmoformer { server unix:/run/cosmoformer/api.sock; }
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /run/tls/cert.pem;
        ssl_certificate_key /run/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        root /usr/share/nginx/html;
        include /etc/nginx/private-access.conf;
        include /etc/nginx/csp.conf;
        add_header Cache-Control no-store always;

        # Version namespaces and unknown endpoints remain upstream responses.
        location ~ ^/api(?:/|$) { include /etc/nginx/proxy.inc; }
        location ~ ^/worker/v1/attempts/[0-9a-f-]+/artifacts/[0-9a-f-]+$ {
            client_max_body_size 67108865;
            include /etc/nginx/proxy.inc;
        }
        location ~ ^/worker(?:/|$) {
            client_max_body_size 1m;
            include /etc/nginx/proxy.inc;
        }
        # Only signed Bitbucket delivery may bypass the private client ACL.
        # Public network reachability still requires a separate operator rule.
        location ~ "^/webhooks/bitbucket/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$" {
            allow all;
            limit_except POST { deny all; }
            client_max_body_size 1m;
            include /etc/nginx/proxy.inc;
        }
        location ~ ^/(?:webhooks|oauth|health)(?:/|$) {
            client_max_body_size 1m;
            include /etc/nginx/proxy.inc;
        }
        location /assets/ {
            try_files $uri =404;
            include /etc/nginx/csp.conf;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location /brand/ { try_files $uri =404; }
        location = /index.html { try_files $uri =404; }
        location = / { try_files /index.html =404; }
        location ~ ^/(?:login|organizations|account/(?:setup|reset)|o/[^/]+/p/[^/]+(?:/(?:modules|stacks|runs)/[^/]+)?)/?$ {
            try_files $uri /index.html;
        }
        location / { try_files $uri =404; }
    }
}
